name: Build and deploy Node.js app to Azure Web App - skribbl-game

on:
  push:
    branches:
      - frontend_backup
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Cài đặt dependency & build (nếu có script build)
      - name: npm install and build
        run: |
          npm install
          # npm run build --if-present

      # Nén toàn bộ mã nguồn/build thành file release.zip
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "*.git*"

      # Upload file release.zip lên
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'skribbl-game'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
